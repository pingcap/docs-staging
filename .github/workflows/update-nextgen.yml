name: Update docs.tidb.io

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Source Repo"
        required: true
        type: choice
        options:
          - pingcap/docs
          - pingcap/docs-cn
          - pingcap/docs-dm
          - pingcap/docs-tidb-operator
      branch:
        description: "Source branch"
        type: string
        required: true
      full:
        description: "Full update"
        type: boolean
        default: false
        required: false

env:
  EN_CLOUD_BRANCH: feature/preview-top-navigation
  JA_CLOUD_BRANCH: i18n-ja-release-8.5
  ZH_CLOUD_BRANCH: i18n-zh-release-8.5
  INPUT_REPO: ${{ inputs.repo }}
  INPUT_BRANCH: ${{ inputs.branch }}

concurrency: ${{ github.workflow }}-${{ inputs.repo }}-${{ inputs.branch }}

jobs:
  build:
    concurrency: update-${{ inputs.repo }}-${{ inputs.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3
        with:
          ref: nextgen

      - name: Validate workflow inputs
        run: |
          case "${INPUT_REPO}" in
            pingcap/docs|pingcap/docs-cn|pingcap/docs-dm|pingcap/docs-tidb-operator) ;;
            *)
              echo "::error::Invalid repo input: ${INPUT_REPO}"
              exit 1
              ;;
          esac

          if [[ -z "${INPUT_BRANCH}" ]] || \
             [[ ! "${INPUT_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]] || \
             [[ "${INPUT_BRANCH}" == /* ]] || \
             [[ "${INPUT_BRANCH}" == */ ]] || \
             [[ "${INPUT_BRANCH}" == .* ]] || \
             [[ "${INPUT_BRANCH}" == *. ]] || \
             [[ "${INPUT_BRANCH}" == -* ]] || \
             [[ "${INPUT_BRANCH}" == *".."* ]] || \
             [[ "${INPUT_BRANCH}" == *"//"* ]] || \
             ! git check-ref-format --branch "${INPUT_BRANCH}" >/dev/null 2>&1; then
            echo "::error::Invalid branch input: ${INPUT_BRANCH}"
            exit 1
          fi

      - uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: "yarn"

      - run: yarn
      - name: Init git info
        run: |
          git status
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Update target folder by event input
        if: ${{ !inputs.full }}
        env:
          GITHUB_AUTHORIZATION_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # handle zh auto translated docs branch(only cloud)
          if [ "${INPUT_REPO}" = "pingcap/docs" ] && [ "${INPUT_BRANCH}" = "${ZH_CLOUD_BRANCH}" ]
          then
          yarn download:tidb-cloud:zh --ref "${INPUT_BRANCH}"
          exit 0
          fi

          # handle ja auto translated docs branch(tidb and cloud)
          if [ "${INPUT_REPO}" = "pingcap/docs" ] && [ "${INPUT_BRANCH}" = "${JA_CLOUD_BRANCH}" ]
          then
          yarn download:tidb-cloud:ja --ref "${INPUT_BRANCH}"
          yarn download "${INPUT_REPO}" --ref "${INPUT_BRANCH}"
          exit 0
          fi

          # handle tidb-cloud doc based on specified en doc branch
          if [ "${INPUT_REPO}" = "pingcap/docs" ] && [ "${INPUT_BRANCH}" = "${EN_CLOUD_BRANCH}" ]
          then
          yarn download:tidb-cloud:en --ref "${INPUT_BRANCH}"
          yarn download "${INPUT_REPO}" --ref "${INPUT_BRANCH}"
          exit 0
          fi

          # docs-dm and docs-tidb-operator need specify language
          if [ "${INPUT_REPO}" = "pingcap/docs-dm" ] || [ "${INPUT_REPO}" = "pingcap/docs-tidb-operator" ]
          then
          yarn download "${INPUT_REPO}" en --ref "${INPUT_BRANCH}"
          yarn download "${INPUT_REPO}" zh --ref "${INPUT_BRANCH}"
          exit 0
          fi

          yarn download "${INPUT_REPO}" --ref "${INPUT_BRANCH}"

      - name: Update all folder
        if: ${{ inputs.full }}
        env:
          GITHUB_AUTHORIZATION_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          sudo rm -fr ./markdown-pages/*
          yarn download:tidb:en:all
          yarn download:tidb-cloud:en
          yarn download:tidb:zh:all
          yarn download:tidb:ja:all
          yarn download:tidb-cloud:ja
          yarn download:tidb-cloud:zh
          yarn download:dm:all
          yarn download:tidb-operator:all

      - name: Git commit
        run: |
          git add markdown-pages
          git fetch
          git pull
          if [[ -z $(git status -s) ]]
          then
            git status
          else
            git commit -m "update MD by dispatch event ${INPUT_REPO} ${INPUT_BRANCH}"
          fi

      - name: Git push
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_on: error
          command: |
            git pull --rebase
            git push

      - name: Trigger website-docs production workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'pingcap',
              repo: 'website-docs',
              workflow_id: 'production.yml',
              ref: 'preview-nextgen',
            })
